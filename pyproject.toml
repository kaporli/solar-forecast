[project]
name = "solar-forecast"
version = "0.1.0"
description = "Belgian aggregate and PVDAQ 2107 solar forecasts from open data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pvlib>=0.11",
    "pyarrow>=15",
]

[project.scripts]
solar-data = "solar_forecast.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
